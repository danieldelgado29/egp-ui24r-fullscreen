<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#090d13"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.png"><title>EGP Ui24R Fullscreen</title><style>
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#080b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;touch-action:none}#viewport{position:absolute;inset:0;overflow:hidden;background:#080b10}#stage{position:absolute;left:0;top:0;width:1180px;height:720px;transform-origin:0 0;will-change:transform}iframe{border:0;width:100%;height:100%;background:#0c1014;display:block}.toolbar{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));display:flex;gap:5px;z-index:99;background:#111b28e8;padding:5px;border:1px solid #476179;border-radius:12px;box-shadow:0 2px 20px #000a}.toolbar button{background:#233b52;color:#fff;border:0;border-radius:8px;min-width:37px;min-height:35px;font-size:16px;font-weight:700}.toolbar button:active{background:#477397}.toolbar .small{font-size:11px;min-width:49px}.notice{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;z-index:100;background:#0f1929ee;border:1px solid #4e647b;border-radius:11px;padding:10px;max-width:min(390px,calc(100vw - 16px));font-size:13px;line-height:1.4}.notice button{background:#396383;color:#fff;border:0;border-radius:6px;padding:7px 10px;margin-top:6px}.hidden{display:none}.badge{position:fixed;left:6px;bottom:max(9px,env(safe-area-inset-bottom));font-size:11px;background:#111c2cd9;padding:4px 7px;border-radius:6px;pointer-events:none}#veil{position:absolute;inset:0;z-index:20;display:none;touch-action:none}#veil.active{display:block}#handles{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:99;background:#132639b8;color:white;border:1px solid #365574;border-radius:8px;padding:7px;font-size:11px}
</style></head><body>
<div id="viewport"><div id="stage"><iframe id="mixer" src="./connection.html" title="Soundcraft Ui24R" allow="fullscreen"></iframe></div><div id="veil"></div></div>
<div class="notice" id="notice">EGP Ui24R V0.1 · Publicación de demostración. Sin conexión a la consola. Para control real se requiere un servidor HTTPS local independiente que sirva la PWA y la Ui24R desde el mismo origen. Consulta el README.<br><button id="dismiss">Entendido</button></div>
<div id="handles">Zoom: <span id="pct">100%</span></div><div class="toolbar"><button id="minus" aria-label="Reducir">−</button><button id="fit" class="small">AJUSTAR</button><button id="plus" aria-label="Ampliar">+</button><button id="pan" class="small" title="Arrastra la vista sin mover faders">MOVER</button><button id="hide" class="small" title="Ocultar barra">OCULTAR</button></div><div class="badge" id="restore" style="display:none;pointer-events:auto;cursor:pointer">⚙ EGP</div>
<script>
(()=>{'use strict';const stage=document.querySelector('#stage'),frame=document.querySelector('#mixer'),veil=document.querySelector('#veil'),pct=document.querySelector('#pct'),pan=document.querySelector('#pan'),bar=document.querySelector('.toolbar'),restore=document.querySelector('#restore');const W=1180,H=720;let scale=1,x=0,y=0,mode='mix',touches=new Map(),gesture=null;
function constrain(){const vw=innerWidth,vh=innerHeight,w=W*scale,h=H*scale;x=Math.min(0,Math.max(vw-w,x));y=Math.min(0,Math.max(vh-h,y));if(w<vw)x=(vw-w)/2;if(h<vh)y=(vh-h)/2}
function paint(){constrain();stage.style.transform=`translate3d(${x}px,${y}px,0) scale(${scale})`;pct.textContent=`${Math.round(scale*100)}%`}
function fit(){scale=Math.min(innerWidth/W,innerHeight/H);x=(innerWidth-W*scale)/2;y=(innerHeight-H*scale)/2;paint()}
function setScale(s,cx=innerWidth/2,cy=innerHeight/2){const old=scale;scale=Math.max(.34,Math.min(2.5,s));x=cx-(cx-x)*scale/old;y=cy-(cy-y)*scale/old;paint()}
function attachPinch(target,fromFrame){try{target.addEventListener('touchstart',ev=>{if(mode==='move'||ev.touches.length>=2){if(ev.cancelable)ev.preventDefault();const t=Array.from(ev.touches);if(t.length>=2){const a=t[0],b=t[1],ox=fromFrame?x:0,oy=fromFrame?y:0;gesture={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),s:scale,cx:(a.clientX+b.clientX)/2+(fromFrame?x:0),cy:(a.clientY+b.clientY)/2+(fromFrame?y:0),startX:a.clientX,startY:a.clientY,x,y}}else if(mode==='move'){gesture={startX:t[0].clientX,startY:t[0].clientY,x,y,move:true}}}}, {passive:false});target.addEventListener('touchmove',ev=>{if(!gesture)return;if(ev.cancelable)ev.preventDefault();const t=Array.from(ev.touches);if(t.length>=2&&!gesture.move){const d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);setScale(gesture.s*d/Math.max(1,gesture.d),gesture.cx,gesture.cy)}else if(mode==='move'&&t.length){x=gesture.x+t[0].clientX-gesture.startX;y=gesture.y+t[0].clientY-gesture.startY;paint()}},{passive:false});target.addEventListener('touchend',ev=>{if(ev.touches.length<2)gesture=null},{passive:false})}catch(e){console.warn('No se pudo activar gesto en frame',e)}}
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;if(doc&&doc.documentElement){attachPinch(doc,true)}}catch(e){document.querySelector('#notice').innerHTML='La Ui24R está bloqueando el acceso desde otra dirección. Es necesario servir esta PWA y la consola desde el mismo origen HTTPS mediante el proxy local. <button id="closeError">Cerrar</button>';document.querySelector('#closeError').onclick=()=>document.querySelector('#notice').classList.add('hidden')}});
document.querySelector('#minus').onclick=()=>setScale(scale/.82);document.querySelector('#plus').onclick=()=>setScale(scale*1.22);document.querySelector('#fit').onclick=fit;document.querySelector('#dismiss').onclick=()=>document.querySelector('#notice').classList.add('hidden');pan.onclick=()=>{mode=mode==='mix'?'move':'mix';veil.classList.toggle('active',mode==='move');pan.textContent=mode==='move'?'LISTO':'MOVER';pan.style.background=mode==='move'?'#487799':'#233b52'};document.querySelector('#hide').onclick=()=>{bar.style.display='none';document.querySelector('#handles').style.display='none';restore.style.display='block'};restore.onclick=()=>{bar.style.display='flex';document.querySelector('#handles').style.display='block';restore.style.display='none'};attachPinch(veil,false);addEventListener('resize',paint);fit();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
